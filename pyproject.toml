[project]
name = "forecast-arena"
version = "0.1.0"
description = "Testing AI forecasting models against reality. Reproducible benchmarks, real world datasets and honest results."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gjusev" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pyyaml>=6",
    "huggingface-hub>=0.25",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "psutil>=7.2.2",
]
dashboard = ["gradio>=4.36", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]
foundation = [
    "chronos-forecasting>=2.3.2",
    "timesfm[torch]>=3.0.2",
]

[project.scripts]
arena = "forecast_arena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_arena"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# D1xx (missing docstring) relaxed: public APIs carry docstrings, helpers do not
ignore = ["D203", "D213", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E402"]
"scripts/*" = ["D"]
"dashboard/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
