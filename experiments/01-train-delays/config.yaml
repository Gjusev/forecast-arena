# Experiment 01: Deutsche Bahn train delays (completed-hour protocol, ADR-0001)
experiment: train-delays

stations:
  - Frankfurt(Main)Hbf
  - Köln Hbf
  - München Hbf
  - Berlin Hbf
  - Hamburg Hbf

targets:
  - avg_delay_min        # primary
  - n_delayed_gt5        # secondary (disruption detection)

data:
  raw_dir: data/raw/db
  aggregates: data/processed/train_delays_hourly.parquet
  # Full panel 2024-07 .. 2026-10; the tier slicing picks recent windows.
  start: "2024-07-01"
  end: null

protocol:
  horizon: 24
  eval_horizons: [1, 3, 6, 24]
  origin_step_hours: 167   # ~weekly but phase-shifted: origins rotate
                          # through all hours so short horizons aren't night-biased
  min_train_hours: 2160    # 90 days minimum history before first origin

events:
  train_quantile: 0.9      # disruption-hour threshold per station, frozen on train

baseline_model: seasonal_naive_24h
results_dir: experiments/01-train-delays/results

models:
  - seasonal_naive_24h
  - hour_of_week_climatology
  - lightgbm
  - xgboost
  - timestral_28m
  - timestral_209m
  - chronos_2
  - timesfm_3_0

tiers:
  smoke:
    n_origins: 2
    series_limit: 1
    models: [seasonal_naive_24h, lightgbm, timestral_209m]
  pilot:
    n_origins: 8
  full:
    n_origins: null
