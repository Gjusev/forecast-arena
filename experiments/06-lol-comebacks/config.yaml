# Experiment 06: League of Legends gold-difference comebacks (HF AngryBacteria/league_of_legends, Apache-2.0)
experiment: lol_comebacks

data:
  raw_dir: data/raw/lol
  # synthetic game-minute grid: minute k -> 2000-01-01 00:00 + k * 60 s (one
  # origin per match; timestamps are game-minute indices, not wall clock)
  hourly: data/raw/lol/lol_gold_minute.parquet

protocol:
  horizon: 20                  # forecast game-minutes 15..34 from the first 15
  eval_horizons: [1, 5, 10, 15, 20]
  origin_step_hours: 1000000000  # a single origin per match: origins() = [15]
  min_train_hours: 15          # the 15-minute information cut

baseline_model: persistence
results_dir: experiments/06-lol-comebacks/results

models:
  - persistence
  - drift
  - timestral_28m
  - timestral_209m
  - chronos_2
  - timesfm_3_0

tiers:
  smoke:
    series_limit: 30
    models: [persistence, drift, chronos_2]
  pilot:
    series_limit: 500
  full:
    series_limit: null
