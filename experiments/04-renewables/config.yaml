# Experiment 04: German renewable generation (energy-charts public_power, CC BY 4.0)
experiment: renewables

data:
  raw_dir: data/raw/energy_charts
  hourly: data/raw/energy_charts/renewables_hourly.parquet
  start: "2019-01-01"   # post zone-change (DE-AT-LU -> DE-LU, 2018-10)
  end: null

protocol:
  horizon: 24            # the 24 hours after the origin
  eval_horizons: [1, 3, 6, 24]
  origin_step_hours: 24  # daily origins
  min_train_hours: 17520 # 2 years of history before the first origin

events:
  train_quantile: 0.99   # forecast-error spike threshold frozen on train

baseline_model: seasonal_naive_24h
results_dir: experiments/04-renewables/results

models:
  - seasonal_naive_24h
  - hour_of_week_climatology
  - lightgbm
  - xgboost
  - timestral_28m
  - timestral_209m
  - chronos_2
  - timesfm_3_0

tiers:
  smoke:
    n_origins: 3
    series_limit: 2
    models: [seasonal_naive_24h, lightgbm, chronos_2]
  pilot:
    n_origins: 8
  full:
    n_origins: null
