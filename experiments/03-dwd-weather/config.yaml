# Experiment 03: DWD station observations, hourly 2m air temperature
experiment: dwd_weather

data:
  raw_dir: data/raw/dwd
  hourly: data/raw/dwd/dwd_weather_hourly.parquet
  start: "2015-01-01"    # modern era; all 30 stations online well before
  end: null

protocol:
  horizon: 24            # next 24 wall-clock hours
  eval_horizons: [1, 3, 6, 24]
  origin_step_hours: 24  # daily origins
  min_train_hours: 17520 # 2 years of history before the first origin

events:
  train_quantile: 0.9    # heat-day threshold frozen on train

baseline_model: seasonal_naive_24h
results_dir: experiments/03-dwd-weather/results

models:
  - seasonal_naive_24h
  - hour_of_week_climatology
  - lightgbm
  - xgboost
  - timestral_28m
  - timestral_209m
  - chronos_2
  - timesfm_3_0

tiers:
  smoke:
    n_origins: 3
    series_limit: 2
    models: [seasonal_naive_24h, lightgbm, chronos_2]
  pilot:
    n_origins: 8
  full:
    n_origins: null
